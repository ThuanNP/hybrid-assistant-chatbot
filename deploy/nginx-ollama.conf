# ==============================================================================
# Cấu hình mẫu Nginx Reverse Proxy bảo vệ máy chủ Ollama (Cách C)
# 
# BỐI CẢNH: Máy chủ Ollama KHÔNG CÓ CƠ CHẾ XÁC THỰC.
# API của nó không chỉ phục vụ sinh văn bản mà còn cho phép:
#   - Tải model mới (/api/pull)
#   - Tạo model (/api/create)
#   - Xoá model (/api/delete)
#   - Đẩy model lên registry (/api/push)
#   - Sao chép model (/api/copy)
# Mặc định Ollama chỉ nghe ở 127.0.0.1 nên an toàn.
# Khi buộc phải mở rộng cho máy khác truy cập, cấu hình này đặt Nginx làm lá chắn:
#   1. Yêu cầu xác thực (Basic Auth hoặc mTLS).
#   2. Chặn triệt để 5 đường dẫn quản trị nguy hiểm kể trên.
#   3. Chỉ cho phép các đường dẫn suy luận: /api/chat, /v1/chat/completions,
#      /v1/embeddings, /api/embed, /api/tags, /api/ps, /api/show.
#   4. Tắt đệm proxy để phục vụ truyền phát trực tuyến Server-Sent Events (SSE).
# ==============================================================================

upstream ollama_backend {
    server 127.0.0.1:11434;
    keepalive 32;
}

server {
    listen 11435;
    server_name localhost;

    # Cấu hình xác thực cơ bản (HTTP Basic Authentication)
    # Tạo tệp mật khẩu bằng lệnh: htpasswd -c /etc/nginx/.htpasswd can_bo_ai
    auth_basic "Ollama Protected API";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Cấu hình xác thực hai chiều mTLS (tuỳ chọn nâng cao, bỏ dấu # khi dùng)
    # ssl_client_certificate /etc/nginx/certs/ca.crt;
    # ssl_verify_client on;

    # Thiết lập tiêu đề chuyển tiếp
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Tắt đệm hỗ trợ truyền phát trực tuyến SSE (Server-Sent Events)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    chunked_transfer_encoding on;

    # --------------------------------------------------------------------------
    # 1. CHẶN TRIỆT ĐỂ CÁC ĐƯỜNG DẪN QUẢN TRỊ MÔ HÌNH NGUY HIỂM CỦA OLLAMA
    # --------------------------------------------------------------------------

    location /api/pull {
        return 403 '{"loi": {"ma": "KHONG_CO_QUYEN", "thong_diep": "Duong dan /api/pull bi cam vi ly do an toan."}}\n';
    }

    location /api/create {
        return 403 '{"loi": {"ma": "KHONG_CO_QUYEN", "thong_diep": "Duong dan /api/create bi cam vi ly do an toan."}}\n';
    }

    location /api/delete {
        return 403 '{"loi": {"ma": "KHONG_CO_QUYEN", "thong_diep": "Duong dan /api/delete bi cam vi ly do an toan."}}\n';
    }

    location /api/push {
        return 403 '{"loi": {"ma": "KHONG_CO_QUYEN", "thong_diep": "Duong dan /api/push bi cam vi ly do an toan."}}\n';
    }

    location /api/copy {
        return 403 '{"loi": {"ma": "KHONG_CO_QUYEN", "thong_diep": "Duong dan /api/copy bi cam vi ly do an toan."}}\n';
    }

    # --------------------------------------------------------------------------
    # 2. CHỈ CHO PHÉP CÁC ENDPOINT SUY LUẬN VÀ TRUY VẤN TRẠNG THÁI
    # --------------------------------------------------------------------------

    location ~ ^/(api/(chat|embed|tags|ps|show)|v1/(chat/completions|embeddings)) {
        proxy_pass http://ollama_backend;
    }

    # Mặc định từ chối mọi đường dẫn không nằm trong danh sách cho phép
    location / {
        return 404 '{"loi": {"ma": "KHONG_TIM_THAY", "thong_diep": "Duong dan khong ton tai hoac khong duoc phep."}}\n';
    }
}
