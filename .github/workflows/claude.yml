name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Chan yeu cau nhay cam truoc khi goi cloud
        env:
          DUONG_DAN_SU_KIEN: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import unicodedata
          from typing import Any


          TU_KHOA_BI_CHAN = (
              "nhay_cam",
              "chi_local",
              "cccd",
              "cmnd",
              "ma khach hang",
              "so dien thoai",
              "so cong to",
              "chi so cong to",
          )


          def lam_phang_noi_dung(gia_tri: Any) -> list[str]:
              ket_qua: list[str] = []
              if isinstance(gia_tri, str):
                  ket_qua.append(gia_tri)
                  return ket_qua
              if isinstance(gia_tri, dict):
                  for gia_tri_con in gia_tri.values():
                      ket_qua.extend(lam_phang_noi_dung(gia_tri_con))
                  return ket_qua
              if isinstance(gia_tri, list):
                  for phan_tu in gia_tri:
                      ket_qua.extend(lam_phang_noi_dung(phan_tu))
              return ket_qua


          def chuan_hoa_noi_dung(noi_dung: str) -> str:
              noi_dung_khong_dau = unicodedata.normalize("NFD", noi_dung.casefold())
              return "".join(
                  ky_tu for ky_tu in noi_dung_khong_dau if unicodedata.category(ky_tu) != "Mn"
              )


          def co_noi_dung_bi_chan(du_lieu_su_kien: dict[str, Any]) -> bool:
              for noi_dung in lam_phang_noi_dung(du_lieu_su_kien):
                  noi_dung_chuan_hoa = chuan_hoa_noi_dung(noi_dung)
                  if any(tu_khoa in noi_dung_chuan_hoa for tu_khoa in TU_KHOA_BI_CHAN):
                      return True
              return False


          with open(os.environ["DUONG_DAN_SU_KIEN"], encoding="utf-8") as tep_su_kien:
              du_lieu_su_kien: dict[str, Any] = json.load(tep_su_kien)

          if co_noi_dung_bi_chan(du_lieu_su_kien):
              sys.stderr.write(
                  "::error::Yeu cau co dau hieu NHAY_CAM hoac chi_local nen workflow dung truoc khi goi Claude.\n"
              )
              raise SystemExit(1)
          PY

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'
