services:
  db:
    image: postgres:17
    restart: unless-stopped
    networks:
      - mang_tro_ly
    environment:
      # Không đặt giá trị mặc định cho tài khoản CSDL: thiếu trong .env thì compose dừng và báo lỗi
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB trong .env}
    volumes:
      - du_lieu_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    networks:
      - mang_tro_ly
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
    ports:
      # Mọi truy cập của người dùng đi qua frontend nginx cổng 8080; cổng 8000 chỉ mở ở
      # loopback cho kiểm tra sức khỏe, kịch bản chẩn đoán và tài liệu nội bộ trên chính máy
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # Hỗ trợ container gọi Ollama/LM Studio chạy trên máy chủ
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - mang_tro_ly
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  mang_tro_ly:
    driver: bridge

volumes:
  du_lieu_postgres:
