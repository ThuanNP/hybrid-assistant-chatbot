server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Phân giải tên backend qua DNS nội bộ của Docker mỗi khi cần (tối đa 10 giây lưu đệm),
    # thay vì một lần lúc khởi động: tạo lại container backend sẽ đổi IP và gây 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_goc http://backend:8000;

    # Tiêu đề bảo mật (Security Headers)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Nén gzip cho tài nguyên tĩnh, KHÔNG gzip text/event-stream
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # Định tuyến phía client cho Angular SPA. index.html không được lưu đệm để mỗi lần triển
    # khai trình duyệt nhận ngay main.js mới (tệp tĩnh có mã băm trong tên nên lưu đệm được).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Tệp tĩnh không tồn tại (chunk của bản cũ) trả 404 thay vì index.html, để ứng dụng
    # nhận ra lỗi tải chunk và tự tải lại trang
    location ~* \.(?:js|mjs|css|map|woff2?|ttf|png|jpe?g|svg|ico|webp)$ {
        try_files $uri =404;
    }

    # Chuyển tiếp API sang dịch vụ FastAPI backend
    location /api/ {
        proxy_pass $backend_goc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Thiếu dòng này, nginx gom các mảnh lại rồi trả về một lần - nguyên nhân phổ biến nhất khiến phát theo dòng chạy tốt trên phần cứng thử nghiệm nhưng không hoạt động khi triển khai lên máy chủ.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Ma-Yeu-Cau $http_x_ma_yeu_cau;
        # Ghi đè (không nối thêm) để backend chỉ thấy IP thật của kết nối tới nginx
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Chuyển tiếp kiểm tra sức khoẻ sống (liveness probe) sang backend
    location = /health {
        proxy_pass $backend_goc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Chuyển tiếp kiểm tra sẵn sàng (readiness probe) sang backend
    location = /ready {
        proxy_pass $backend_goc;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
