server {
    listen 8080;
    listen [::]:8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Tiêu đề bảo mật (Security Headers)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # Nén gzip cho tài nguyên tĩnh, KHÔNG gzip text/event-stream
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # Định tuyến phía client cho Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Chuyển tiếp API sang dịch vụ FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Thiếu dòng này, nginx gom các mảnh lại rồi trả về một lần - nguyên nhân phổ biến nhất khiến phát theo dòng chạy tốt trên phần cứng thử nghiệm nhưng không hoạt động khi triển khai lên máy chủ.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Ma-Yeu-Cau $http_x_ma_yeu_cau;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Chuyển tiếp kiểm tra sức khoẻ sống (liveness probe) sang backend
    location = /health {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # Chuyển tiếp kiểm tra sẵn sàng (readiness probe) sang backend
    location = /ready {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
