<div
  class="huy-hieu-container"
  [class.canh-bao-roi-tang]="laRoiTangHoacHaCap()"
  [class.dam-may]="tang() > 0"
  [title]="moTaDayDu()"
  role="note"
  [attr.aria-label]="moTaDayDu()"
>
  <span class="nhan-tang">
    <span class="cham-nguon" aria-hidden="true"></span>
    {{ nhanNguonTang() }}
  </span>
  <!-- Ten model da co trong nhan "Noi dung do AI tao" ngay duoi nen khong lap lai o day;
       van co trong tooltip moTaDayDu -->
  <span>{{ chuoiToken() }}</span>
  @if (chiPhiUsd() > 0) {
    <span class="thong-so-chi-phi">{{ chuoiChiPhi() }}</span>
  }
  @if (tocDoTokS() > 0) {
    <span>{{ chuoiTocDo() }}</span>
  }
  @if (doTreMs() > 0) {
    <span>{{ chuoiDoTre() }}</span>
  }

  @if (maYeuCau()) {
    <!-- Chip ma yeu cau co chu, tach bach voi nut sao chep cau tra loi (bieu tuong) ben phai -->
    <button
      type="button"
      class="nut-sao-chep"
      (click)="saoChepThongSo()"
      title="Sao chép mã yêu cầu để gửi bộ phận hỗ trợ"
      [attr.aria-label]="'Sao chép mã yêu cầu: ' + maYeuCau()"
    >
      {{ daSaoChep() ? 'Đã sao chép mã' : 'Mã yêu cầu: ' + maYeuCau() }}
    </button>
  }
</div>
