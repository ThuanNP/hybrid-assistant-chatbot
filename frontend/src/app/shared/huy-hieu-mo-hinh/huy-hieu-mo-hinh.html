<div
  class="huy-hieu-container"
  [class.canh-bao-roi-tang]="laRoiTangHoacHaCap()"
  [class.dam-may]="tang() > 0"
  [title]="moTaDayDu()"
  role="note"
  [attr.aria-label]="moTaDayDu()"
>
  <span class="nhan-tang">
    <span class="cham-nguon" aria-hidden="true"></span>
    {{ nhanNguonTang() }}
  </span>
  <span class="ten-model">{{ model() }}</span>
  <span>{{ tokenVao() }}/{{ tokenRa() }} token</span>
  @if (chiPhiUsd() > 0) {
    <span class="thong-so-chi-phi">{{ chuoiChiPhi() }}</span>
  }
  @if (tocDoTokS() > 0) {
    <span>{{ tocDoTokS() }} tok/s</span>
  }
  @if (doTreMs() > 0) {
    <span>{{ chuoiDoTre() }}</span>
  }

  @if (maYeuCau()) {
    <button
      type="button"
      class="nut-sao-chep"
      (click)="saoChepThongSo()"
      [title]="'Mã yêu cầu: ' + maYeuCau()"
      [attr.aria-label]="'Sao chép mã yêu cầu: ' + maYeuCau()"
    >
      <svg
        class="icon-copy"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
    </button>
  }
</div>
