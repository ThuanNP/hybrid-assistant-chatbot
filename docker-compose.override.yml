# ==============================================================================
# docker-compose.override.yml - CHỈ DÙNG CHO DEV, KHÔNG DÙNG KHI VẬN HÀNH
# ==============================================================================

services:
  db:
    # Ánh xạ cổng loopback 127.0.0.1:5432 CHỈ ở môi trường dev để chạy migration và pytest từ máy chủ
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    volumes:
      - ./scripts:/srv/scripts:ro
      - ./data:/srv/data:ro
      - ./eval:/srv/eval:ro
      - ./ket_qua_eval:/srv/ket_qua_eval
      - ./docs:/srv/docs
