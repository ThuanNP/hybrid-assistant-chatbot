    cau_hoi: "Dữ liệu cá nhân của khách hàng không được nhập và trợ lý đã tra được tài liệu nội bộ chưa?"
    tra_loi: "Tuyệt đối không nhập mã khách hàng, số điện thoại, số CCCD hay chỉ số công tơ vào trợ lý. Ở phiên bản hiện tại, trợ lý chưa kết nối tra cứu tài liệu nội bộ tự động (chức năng RAG sẽ được bổ sung ở Giai đoạn 6)."
    tu_khoa:
      - du lieu ca nhan
      - nhay cam
      - khong duoc nhap
      - ma khach hang
      - tai lieu noi bo
      - rag
