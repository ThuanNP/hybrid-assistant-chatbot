# Cấu hình RAG (Retrieval-Augmented Generation) và kho tri thức
# Căn cứ: Quy tắc kỹ thuật số 5, 6 trong AGENTS.md

# Tên logic của mô hình nhúng (lưu vào tai_lieu.model_nhung)
model_nhung: "bge-m3"

# Thẻ mô hình thực tế dùng khi gọi bộ chạy theo từng hồ sơ GPU
# gpu6, gpu8: dùng bge-m3-cpu để không chiếm VRAM của model chat
# hồ sơ khác: dùng bge-m3 chạy trên GPU
the_nhung_theo_ho_so:
  gpu6: "bge-m3-cpu:567m-fp16"
  gpu8: "bge-m3-cpu:567m-fp16"
  gpu12: "bge-m3:567m-fp16"
  gpu16: "bge-m3:567m-fp16"
  gpu24: "bge-m3:567m-fp16"

so_chieu: 1024
kich_thuoc_lo: 32

k_truy_hoi: 20
k_rrf: 60
k_dua_vao_ngu_canh: 5

# Đã hiệu chuẩn ở PROMPT 29 (biên an toàn 1.6697 > 0, docs/hieu-chuan-nguong.json)
nguong_tu_choi: 39.4211
cong_phu_tu_khoa: 0.30

# Ngưỡng kiểm tra chất lượng tài liệu khi nạp
ky_tu_toi_thieu_moi_trang: 200
ty_le_tu_co_dau_toi_thieu: 0.5
token_doan_toi_da: 500

# Trọng số tái xếp hạng theo năm dấu hiệu (tổng điểm chuẩn 100)
trong_so_tai_xep_hang:
  bigram: 38
  tieu_de_muc: 26
  chuoi_so: 20
  than_doan: 16

# Hệ số nhân phạt đoạn dài (từ 0.85 đến 1.00)
he_so_phat_doan_dai_min: 0.85
he_so_phat_doan_dai_max: 1.00
nguong_doan_dai_bat_dau_phat: 200

